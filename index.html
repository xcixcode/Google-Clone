<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <!-- Google Search Console -->
    <meta name="google-site-verification" content="Q5nfMziST5tgsHaAJ7CjpcWxddsXkPrGG76G9H2fJ8g" />
    <meta name="googlebot" content="noindex" />
    <title>Google | Google-Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="https://www.google.com/apple-touch-icon.png">
</head>
<body>
    <!-- 헤더 영역 -->
    <header class="header">
        <!-- 좌측 메뉴 -->
        <nav class="header-left">
            <a href="https://about.google/intl/ko/" class="header-link">Google 정보</a>
            <a href="https://store.google.com/kr" class="header-link">스토어</a>
        </nav>

        <!-- 모바일 전용 탭 (전체 / 이미지) -->
        <nav class="header-tabs" aria-label="검색 유형">
            <a href="https://www.google.com/" class="header-tab active" aria-current="page">전체</a>
            <a href="https://www.google.co.kr/imghp?hl=ko" class="header-tab">이미지</a>
        </nav>

        <!-- 우측 메뉴 -->
        <nav class="header-right">
            <a href="https://mail.google.com/mail/?hl=ko" class="header-link">Gmail</a>
            <a href="https://www.google.co.kr/imghp?hl=ko" class="header-link">이미지</a>

            <!-- Google 앱 그리드 버튼 -->
            <button class="icon-btn apps-btn" aria-label="Google 앱">
                <svg class="apps-icon" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#5f6368" d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z"/>
                </svg>
            </button>

            <!-- 프로필 버튼 -->
            <button class="profile-btn" aria-label="Google 계정">
                <span class="profile-avatar">S</span>
            </button>
        </nav>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-content">
        <!-- Google 로고 -->
        <div class="logo-container">
            <svg class="google-logo" aria-label="Google" role="img" viewBox="0 0 272 92" width="272" height="92" xmlns="http://www.w3.org/2000/svg">
                <path d="M31.32 70.33c17.65.17 29.67-11.68 29.67-29.92q.01-2.29-.43-5.08H31.2v8.76h20.6c-1.1 11.47-9.18 17.44-20.27 17.44-12.44 0-21.96-9.35-21.96-22.94 0-13.41 9.1-22.77 21.96-22.77 6.48 0 11.26 2 16.04 6.9l6.14-6.43c-5.38-6.3-13.16-9.31-22.3-9.31C13.7 6.98 0 20.27 0 38.46c0 17.4 13.25 31.7 31.32 31.87" fill="#3186FF"></path>
                <path d="M88.2 70.33c13.2 0 22.77-9.69 22.77-23.15 0-13.2-9.35-22.98-22.77-22.98-12.7 0-22.68 9.02-22.68 22.98 0 13.33 9.43 23.15 22.68 23.15m0-8.04c-8.04 0-13.67-6.6-13.67-15.1s5.93-14.95 13.67-14.95c8.17 0 13.67 6.6 13.67 14.94 0 8.64-5.63 15.11-13.67 15.11" fill="#FC413D"></path>
                <path d="M137.42 70.33c13.29 0 22.77-9.73 22.77-23.15 0-13.2-9.35-22.98-22.77-22.98-12.7 0-22.68 9.02-22.68 22.98 0 13.33 9.43 23.15 22.68 23.15m0-8.04c-8.04 0-13.67-6.6-13.67-15.1s5.93-14.95 13.67-14.95c8.17 0 13.67 6.6 13.67 14.94 0 8.64-5.63 15.11-13.67 15.11" fill="#FFBE00"></path>
                <path d="M185.37 88.57q21.51 0 21.5-24.63V25.77h-8.8v5.37h-.17c-2.75-4.27-7.96-6.68-13.84-6.68-12.7 0-20.44 9.69-20.44 22.6 0 12.86 7.53 22.34 20.78 22.34 6.52 0 11.34-3.72 13.37-6.77h.3v3.94c0 8.67-4.49 13.8-12.82 13.8-5.46 0-9.1-3.01-11.77-8.05l-7.96 3.52c4.2 8.84 10.16 12.73 19.85 12.73m0-27.55c-7.74 0-12.7-5.71-12.7-14.22 0-8.2 4.92-14.13 12.75-14.13s12.65 5.5 12.65 14.09c0 8.68-5.08 14.26-12.7 14.26" fill="#3186FF"></path>
                <path d="M222.91 8.33h-9.22v60.6h9.22z" fill="#00AF57"></path>
                <path d="M250.17 70.25a22.1 22.1 0 0 0 19-10.54l-6.86-4.49c-3 4.2-7.1 6.6-11.72 6.6a13.6 13.6 0 0 1-11.93-7.23l30.93-13.12a20 20 0 0 0-.84-3.22c-3.69-9.48-10.12-13.8-18.8-13.8-13.24 0-22.25 9.66-22.25 23.03 0 13.67 9.47 22.77 22.47 22.77m-13.5-22.81v-.51c0-8.76 5.03-14.64 12.95-14.64 3.76 0 7.15 1.69 9.44 5.67z" fill="#FC413D"></path>
            </svg>
        </div>

        <!-- 검색 폼 -->
        <form class="search-form" action="https://www.google.com/search" method="GET">
            <div class="search-container" id="searchContainer">
                <!-- + 아이콘 (검색 추가) -->
                <button type="button" class="add-btn" aria-label="검색 추가">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="#9aa0a6" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                </button>

                <!-- 검색 입력창 -->
                <input
                    type="text"
                    class="search-input"
                    name="q"
                    id="searchInput"
                    autocomplete="off"
                    aria-label="검색"
                    placeholder="">

                <!-- 구분선 -->
                <div class="search-divider"></div>

                <!-- 우측 아이콘들 -->
                <div class="search-actions">
                    <!-- 키보드 아이콘 -->
                    <button type="button" class="action-btn keyboard-btn" aria-label="가상 키보드">
                        <svg aria-hidden="true" height="24" viewBox="0 -960 960 960" width="24" xmlns="http://www.w3.org/2000/svg">
                            <path fill="var(--YLNNHc)" d="M160-200q-33 0-56.5-23.5T80-280v-400q0-33 23.5-56.5T160-760h640q33 0 56.5 23.5T880-680v400q0 33-23.5 56.5T800-200H160Zm160-120h320v-80H320v80ZM200-440h80v-80h-80v80Zm120 0h80v-80h-80v80Zm120 0h80v-80h-80v80Zm120 0h80v-80h-80v80Zm120 0h80v-80h-80v80ZM200-560h80v-80h-80v80Zm120 0h80v-80h-80v80Zm120 0h80v-80h-80v80Zm120 0h80v-80h-80v80Zm120 0h80v-80h-80v80Z"></path>
                        </svg>
                    </button>

                    <!-- 음성 검색 버튼 -->
                    <button type="button" class="action-btn voice-btn" aria-label="음성으로 검색">
                        <svg class="ByCvB" aria-hidden="true" focusable="false" height="24" width="24" viewBox="0 -960 960 960" xmlns="http://www.w3.org/2000/svg">
                            <path fill="var(--YLNNHc)" d="M480-400q-50 0-85-35t-35-85v-240q0-50 35-85t85-35q50 0 85 35t35 85v240q0 50-35 85t-85 35Zm-40 280v-123q-104-14-172-93t-68-184h80q0 83 58.5 141.5T480-320q83 0 141.5-58.5T680-520h80q0 105-68 184t-172 93v123h-80Z"></path>
                        </svg>
                    </button>

                    <!-- 이미지 검색(렌즈) 버튼 -->
                    <button type="button" class="action-btn lens-btn" aria-label="이미지로 검색">
                        <svg class="hWdRGb" aria-hidden="true" focusable="false" height="24" width="24" viewBox="0 -960 960 960" xmlns="http://www.w3.org/2000/svg">
                            <path fill="var(--YLNNHc)" d="M480-320q-50 0-85-35t-35-85q0-50 35-85t85-35q50 0 85 35t35 85q0 50-35 85t-85 35Zm240 160q-33 0-56.5-23.5T640-240q0-33 23.5-56.5T720-320q33 0 56.5 23.5T800-240q0 33-23.5 56.5T720-160Zm-440 40q-66 0-113-47t-47-113v-80h80v80q0 33 23.5 56.5T280-200h200v80H280Zm480-320v-160q0-33-23.5-56.5T680-680H280q-33 0-56.5 23.5T200-600v120h-80v-120q0-66 47-113t113-47h80l40-80h160l40 80h80q66 0 113 47t47 113v160h-80Z"></path>
                        </svg>
                    </button>

                    <!-- AI 모드 버튼 -->
                    <button type="button" class="ai-mode-btn" id="aiModeBtn" aria-label="AI 모드">
                        <svg focusable="false" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 24 24" height="24" viewBox="0 0 24 24" width="24">
                            <g><rect fill="none" height="24" width="24"></rect></g>
                            <g><g><path d="M17.5 12c0-3.04 2.46-5.5 5.5-5.5-3.04 0-5.5-2.46-5.5-5.5 0 3.04-2.46 5.5-5.5 5.5 3.04 0 5.5 2.46 5.5 5.5z"></path><path d="M15.65 11.58c.18-.5.27-1.03.31-1.58h-2c-.1 1.03-.51 1.93-1.27 2.69-.88.87-1.94 1.31-3.19 1.31C7.03 14 5 12.07 5 9.5 5 7.03 6.93 5 9.5 5c.46 0 .89.08 1.3.2l1.56-1.56C11.5 3.22 10.55 3 9.5 3 5.85 3 3 5.85 3 9.5S5.85 16 9.5 16c.56 0 2.26-.06 3.8-1.3l6.3 6.3 1.4-1.4-6.3-6.3c.4-.5.72-1.08.95-1.72z"></path></g></g>
                        </svg>
                        <span class="ai-label">AI 모드</span>
                    </button>
                </div>

            </div>

            <!-- 검색 버튼들 -->
            <div class="search-buttons">
                <button type="submit" class="search-btn">Google 검색</button>
                <button type="button" class="search-btn lucky-btn" id="luckyBtn">I'm Feeling Lucky</button>
            </div>
        </form>
    </main>

    <!-- 푸터 영역 -->
    <footer class="footer">
        <div class="footer-location">
            <span>대한민국</span>
        </div>
        <div class="footer-links">
            <div class="footer-left">
                <a href="https://ads.google.com/intl/ko_kr/home/">광고</a>
                <a href="https://www.google.com/intl/ko_kr/business/">비즈니스</a>
                <a href="https://www.google.com/search/howsearchworks/?fg=1" class="footer-how">Google 검색의 작동 방식</a>
                <a href="https://about.google/intl/ko/" class="footer-about">Google 정보</a>
            </div>
            <div class="footer-right">
                <a href="https://policies.google.com/privacy?hl=ko&fg=1">개인정보처리방침</a>
                <a href="https://policies.google.com/terms?hl=ko&fg=1">약관</a>
                <button type="button" class="theme-btn">어두운 테마: 사용 중지됨</button>
                <button class="settings-btn" id="settingsBtn">설정</button>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
